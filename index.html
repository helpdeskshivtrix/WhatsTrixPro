<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-title" content="WhatsTrix">
<meta name="color-scheme" content="dark">
<title>WhatsTrix</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ===== WhatsTrix: locked ShivTrix look (sampled from the PdfTrix splash): OLED black, royal blue, cyan, gold ===== */
:root{
  --bg:#000;--pn:#03050b;--cd:#080d1c;--cd2:#0d1530;--ln:#14204a;--ln2:#1d2f6b;
  --bl:#2859e0;--bl2:#5fd2f9;--gd:#e1a142;
  --tx:#eaf0ff;--t2:#8390b0;--t3:#5b6788;--red:#ff5d6c;
  --g:0 0 16px rgba(40,89,224,.5);--g2:0 0 12px rgba(95,210,249,.45);
  --brand:linear-gradient(90deg,#2859e0,#5fd2f9 60%,#e1a142);
  --ui:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:500 15px/1.4 var(--ui)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}input{font:inherit;color:inherit}[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--bl2);outline-offset:2px}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--ln2);border-radius:3px}
svg{flex:none}

/* ---------- splash / lock (the PdfTrix start-up) ---------- */
.boot{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;transition:opacity .6s ease,transform .6s ease;overflow:auto}
.boot.out{opacity:0;transform:scale(1.04);pointer-events:none}
.orb{position:relative;width:min(300px,62vw);aspect-ratio:1;display:grid;place-items:center;flex:none}
.orb::before{content:"";position:absolute;inset:12%;border-radius:50%;background:radial-gradient(circle,rgba(40,89,224,.5),rgba(40,89,224,0) 68%);filter:blur(20px);animation:breathe 3.2s ease-in-out infinite}
.ring{position:absolute;inset:0;width:100%;height:100%;animation:spin 7s linear infinite;overflow:visible}
.logo{position:relative;width:74%;height:74%;object-fit:contain;filter:drop-shadow(0 0 18px rgba(60,120,255,.6))}
.bar{width:min(480px,72vw);height:4px;margin-top:38px;background:#181818;border-radius:4px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;width:0;border-radius:4px;background:var(--brand);box-shadow:0 0 10px rgba(95,210,249,.55);transition:width .7s cubic-bezier(.3,.7,.2,1)}
.tag{margin-top:46px;text-align:center;max-width:92vw}
.tag p{font-weight:700;font-size:clamp(15px,2.3vw,21px);line-height:1.5;color:#626f93;margin:.35em 0;opacity:0;animation:fadein 1s ease forwards}
.tag p:nth-child(2){animation-delay:.55s}.tag p:nth-child(3){animation-delay:1.1s}
.tag a{color:#2f6fd0;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px;text-decoration-color:rgba(47,111,208,.5)}
.tag a:hover{color:var(--bl2)}
.lockbox{margin-top:40px;text-align:center;display:none}
.boot.locked .tag{display:none}.boot.locked .lockbox{display:block}
.lockbox label{display:block;color:var(--t2);font-weight:600;margin-bottom:12px}
#pw{width:min(250px,70vw);background:rgba(8,13,28,.85);border:1px solid var(--ln2);border-radius:16px;padding:12px 10px;text-align:center;font-size:28px;letter-spacing:14px;text-indent:14px;color:#fff;outline:0;caret-color:var(--bl2);transition:border-color .2s,box-shadow .2s}
#pw:focus{border-color:var(--bl);box-shadow:var(--g)}
#pw::placeholder{color:#2a3560;letter-spacing:10px}
#pwe{min-height:22px;margin-top:12px;color:var(--red);font-weight:600;font-size:14px}
.lockbox.bad #pw{animation:shake .38s;border-color:var(--red)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{opacity:.55;transform:scale(.94)}}
@keyframes fadein{to{opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media(prefers-reduced-motion:reduce){.ring,.orb::before{animation:none}.tag p{animation-duration:.01s;animation-delay:0s!important}.boot,.bar i{transition:none}}

/* ---------- shell ---------- */
body{display:flex;flex-direction:column;height:100dvh}
.app{display:grid;grid-template-columns:minmax(320px,380px) 1fr;flex:1;min-height:0}
.side{background:var(--pn);border-right:1px solid var(--ln);display:flex;flex-direction:column;min-height:0;min-width:0}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:radial-gradient(70% 40% at 50% 0,rgba(40,89,224,.16),transparent 70%),#000}
.me{padding:14px 16px 12px;background:radial-gradient(120% 100% at 0 0,rgba(40,89,224,.26),transparent 62%),var(--pn);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.brand img{width:34px;height:34px;border-radius:9px;background:#000;box-shadow:0 0 14px rgba(40,89,224,.5)}
.wm{font-size:21px;font-weight:800;letter-spacing:-.4px;display:flex}
.wm b{background-clip:text;-webkit-background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.wm .w1{background-image:linear-gradient(90deg,#2f6bff,#5fd2f9)}.wm .w2{background-image:linear-gradient(180deg,#fff,#a9b3cc)}
.brand .ib{margin-left:auto}
.top{display:flex;gap:12px;align-items:center}
.av{border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;border:1px solid rgba(95,210,249,.35);background-size:cover;background-position:center}
.nm{font-weight:700;font-size:17px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-size:12.5px;color:var(--t2);cursor:pointer;font-weight:600}
.st i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px}
.st.on i{background:var(--bl2);box-shadow:var(--g2)}
.rid{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 13px;border:1px solid var(--ln2);border-radius:12px;background:rgba(8,13,28,.8);cursor:pointer;transition:.15s}
.rid:hover{border-color:var(--bl);box-shadow:var(--g)}
.rid b{font:700 17px/1 ui-monospace,"Cascadia Mono",Consolas,monospace;letter-spacing:2px;color:var(--bl2)}.rid span{font-size:11.5px;color:var(--t2);flex:none;font-weight:600}
.row{display:flex;gap:8px;margin-top:12px}.row .btn{flex:1;min-width:0}
.me .row{gap:6px}.me .row .btn{padding:9px 4px;font-size:13px;white-space:nowrap}
.btn{padding:9px 12px;border-radius:12px;border:1px solid var(--ln2);background:var(--cd);transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600}
.btn:hover{border-color:var(--bl);box-shadow:0 0 12px rgba(40,89,224,.35)}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn.p{background:linear-gradient(135deg,#1c46c4,var(--bl));border-color:#5a82ff;box-shadow:var(--g);color:#fff;font-weight:700}
.btn.d{border-color:var(--red);color:var(--red)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.join{display:flex;gap:8px;padding:12px 16px 8px}
.join input,.srch input,.foot input[type=text],.sb input{flex:1;min-width:0;background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:10px 14px;outline:0;font-weight:500;transition:.15s}
.join input:focus,.srch input:focus,.foot input:focus,.sb input:focus{border-color:var(--bl);box-shadow:var(--g)}
.srch{padding:0 16px 8px}.srch input{width:100%;padding:8px 14px;font-size:14px}
.tabs{display:flex;gap:6px;padding:0 16px 10px;border-bottom:1px solid var(--ln)}
.tabs button{padding:5px 12px;border-radius:999px;border:1px solid var(--ln);color:var(--t2);font-size:13px;font-weight:700;transition:.15s}
.tabs button.on{color:#000;background:var(--bl2);border-color:var(--bl2);box-shadow:var(--g2)}
.list{flex:1;overflow-y:auto}
.it{position:relative;display:flex;gap:12px;align-items:center;width:100%;padding:11px 16px;text-align:left}
.it:hover{background:rgba(13,21,48,.7)}
.it.a{background:linear-gradient(90deg,rgba(40,89,224,.2),rgba(40,89,224,.04))}
.it.a::before{content:"";position:absolute;left:0;top:14%;bottom:14%;width:3px;border-radius:3px;background:linear-gradient(#2859e0,#5fd2f9,#e1a142);box-shadow:0 0 10px rgba(95,210,249,.6)}
.it .b{flex:1;min-width:0}.it .n{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.it .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.it .n em{font:600 11px var(--ui);color:var(--t2);flex:none}
.it .p2{color:var(--t2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.pn{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:4px;color:var(--gd)}.pn svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bd{background:var(--gd);color:#000;border-radius:10px;min-width:20px;height:20px;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 6px;box-shadow:0 0 10px rgba(225,161,66,.5)}
.dot{position:relative}.dot.on::after{content:"";position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:var(--bl2);border:2px solid #000;box-shadow:var(--g2)}
.empty{padding:30px;text-align:center;color:var(--t2)}
.welcome{flex:1;display:grid;place-items:center;text-align:center;color:var(--t2);padding:24px}
.welcome img{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 0 26px rgba(40,89,224,.65));margin-bottom:14px}
.welcome h1{font-weight:800;font-size:34px;letter-spacing:-.8px;color:var(--tx);margin-bottom:8px}
.welcome p{max-width:380px;margin:0 auto 4px;font-weight:600}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;flex:1;min-height:0}
.hd{display:flex;align-items:center;gap:8px;padding:9px 10px;background:rgba(3,5,11,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.hd .t{flex:1;min-width:0;cursor:pointer}.hd .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hd .s{font-size:12.5px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ib{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--t2);transition:.15s}
.ib:hover{background:var(--cd2);color:var(--tx);box-shadow:0 0 12px rgba(40,89,224,.4)}
.ib svg,.send svg,.ctl svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.back{display:none}
.sb{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--ln)}.sb span{color:var(--t2);font-size:12.5px;font-weight:700;flex:none}
.stream{flex:1;overflow-y:auto;padding:16px max(4%,12px);display:flex;flex-direction:column;gap:5px}
.m{position:relative;max-width:min(76%,560px);padding:7px 11px 6px;border-radius:16px 16px 16px 4px;background:var(--cd);border:1px solid var(--ln);align-self:flex-start;word-break:break-word;white-space:pre-wrap;cursor:pointer;animation:pop .18s ease}
.m.o{align-self:flex-end;border-radius:16px 16px 4px 16px;background:linear-gradient(135deg,#1c46c4,#2859e0);border-color:#4f78f5;box-shadow:0 0 16px rgba(40,89,224,.32)}
.m.hl{animation:flash 1.3s ease}
.m .who{font-size:12.5px;font-weight:800;margin-bottom:2px}.m small{display:block;text-align:right;font-size:11px;opacity:.62;margin-top:3px;font-weight:600;white-space:normal}
.m.gone{opacity:.7;font-style:italic;cursor:default}
.m img,.m video{display:block;max-width:100%;max-height:340px;border-radius:10px;cursor:zoom-in}.m video{cursor:default}.m audio{max-width:100%;height:38px}.m a{color:#fff;text-decoration:underline;text-underline-offset:2px}
.m .q{display:block;border-left:3px solid var(--bl2);background:rgba(0,0,0,.28);border-radius:8px;padding:4px 8px;margin:2px 0 5px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.m.o .q{border-left-color:#fff;background:rgba(0,0,0,.22)}.m .q b{display:block;color:var(--bl2);font-size:12px}.m.o .q b{color:#fff}.m .q span{opacity:.85}
.rxs{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.rx{display:inline-flex;gap:4px;align-items:center;padding:1px 8px;border-radius:999px;border:1px solid var(--ln2);background:rgba(0,0,0,.35);font-size:13px;font-weight:700}
.rx.on{border-color:var(--bl2);background:rgba(95,210,249,.16);box-shadow:var(--g2)}
.sys{align-self:center;color:var(--t2);font-size:12px;font-weight:600;background:rgba(8,13,28,.85);border:1px solid var(--ln);border-radius:10px;padding:3px 12px;margin:4px 0}
mark{background:var(--gd);color:#000;border-radius:3px;padding:0 1px}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}}
@keyframes flash{0%,60%{box-shadow:0 0 0 2px var(--gd),0 0 18px rgba(225,161,66,.6)}}
.rpb{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--pn);border-top:1px solid var(--ln)}
.rpb::before{content:"";align-self:stretch;width:3px;border-radius:3px;background:var(--brand);background:linear-gradient(var(--bl),var(--bl2),var(--gd))}
.rpt{flex:1;min-width:0;font-size:13px}.rpt b{display:block;color:var(--bl2)}.rpt span{display:block;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot{position:relative;display:flex;gap:6px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(3,5,11,.92);border-top:1px solid var(--ln)}
.send{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#1c46c4,var(--bl));box-shadow:var(--g);flex:none;display:grid;place-items:center;color:#fff;transition:.15s}.send:hover{box-shadow:0 0 22px rgba(95,210,249,.55)}
.rec{background:var(--red)!important;animation:pl 1s infinite}@keyframes pl{50%{box-shadow:0 0 18px var(--red)}}
.emo{position:absolute;bottom:64px;left:12px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;background:var(--cd);border:1px solid var(--ln2);border-radius:14px;padding:8px;box-shadow:0 12px 40px rgba(0,0,0,.7);z-index:5}.emo button{font-size:22px;padding:4px;border-radius:8px}.emo button:hover{background:var(--ln)}

/* ---------- sheets ---------- */
.ov{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:16px;backdrop-filter:blur(6px);overflow-y:auto}
.card{background:var(--pn);border:1px solid var(--ln2);border-radius:20px;box-shadow:0 0 44px rgba(40,89,224,.28),0 20px 60px rgba(0,0,0,.7);padding:20px;max-width:400px;width:100%;text-align:center;max-height:96dvh;overflow-y:auto}
.card h2{font-weight:800;margin-bottom:10px;letter-spacing:-.2px}.qr{background:#fff;border-radius:14px;padding:10px;display:inline-block}.qr svg{display:block;width:190px;height:190px}
.card video{width:100%;border-radius:14px;background:#000;max-height:50dvh;object-fit:cover;border:1px solid var(--bl)}.card p{color:var(--t2);font-size:13px;margin-top:8px;word-break:break-all;font-weight:500}
.mem{display:flex;gap:10px;align-items:center;text-align:left;padding:7px 0;border-bottom:1px solid var(--ln)}.mem small{display:block;color:var(--t2)}
.card input{width:100%;background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:12px;text-align:center;outline:0}.card input:focus{border-color:var(--bl);box-shadow:var(--g)}
.lbx{padding:0;background:rgba(0,0,0,.95)}.lbx .card{background:none;border:0;box-shadow:none;max-width:96vw;padding:0}.lbx img{max-width:96vw;max-height:92dvh;border-radius:12px;box-shadow:0 0 40px rgba(40,89,224,.4)}
.mnu .rxrow{display:flex;justify-content:center;gap:2px;padding-bottom:10px;margin-bottom:6px;border-bottom:1px solid var(--ln)}
.mnu .rxrow button{font-size:26px;width:44px;height:44px;border-radius:50%;transition:.12s}.mnu .rxrow button:hover{background:var(--cd2);transform:scale(1.18)}.mnu .rxrow button.on{background:rgba(95,210,249,.18);box-shadow:var(--g2)}
.mnu .act{display:flex;align-items:center;gap:12px;width:100%;padding:11px 8px;border-radius:10px;text-align:left;font-weight:600}.mnu .act:hover{background:var(--cd2)}.mnu .act svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;color:var(--bl2)}.mnu .act.d,.mnu .act.d svg{color:var(--red)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--cd2);border:1px solid var(--bl2);box-shadow:var(--g2);padding:10px 18px;border-radius:12px;z-index:200;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;font-weight:600}.toast.on{opacity:1}

/* ---------- calls ---------- */
.call{position:fixed;inset:0;z-index:110;background:#000;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom))}
.call h2{font-weight:800;text-align:center;margin-bottom:10px;text-shadow:0 0 14px var(--bl)}
.grid{flex:1;min-height:0;display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));grid-auto-rows:1fr}
.tile{position:relative;border-radius:16px;overflow:hidden;background:var(--cd);border:1px solid var(--ln)}.tile video{width:100%;height:100%;object-fit:contain;background:#000}.tile .ph{position:absolute;inset:0;display:none;place-items:center;background:var(--cd)}.tile.nov .ph{display:grid}.tile.mut span::after{content:" 🔇"}.tile span{position:absolute;left:10px;bottom:8px;font-size:13px;font-weight:700;background:rgba(0,0,0,.6);padding:2px 9px;border-radius:8px}
#lv{position:absolute;right:20px;top:calc(60px + env(safe-area-inset-top));width:130px;aspect-ratio:16/9;object-fit:contain;background:#000;border-radius:12px;border:1px solid var(--bl2);box-shadow:var(--g2);transform:scaleX(-1);z-index:2}
.ctl{display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap}.ctl button{width:84px;padding:10px 0;border-radius:18px;background:var(--cd);border:1px solid var(--ln2);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .1s}.ctl button:hover{border-color:var(--bl);box-shadow:var(--g)}.ctl button:active{transform:scale(.93)}.ctl b{display:grid;place-items:center}.ctl span{font-size:11px;color:var(--t2);font-weight:700}.ctl .off{background:#240b14;border-color:var(--red)}.ctl .off span{color:#ff9aae}.ctl .live{background:rgba(95,210,249,.14);border-color:var(--bl2);box-shadow:var(--g2)}.ctl .live span{color:var(--bl2)}.ctl .end{background:var(--red);border-color:var(--red)}.ctl .end span{color:#fff}.ctl svg{width:24px;height:24px}.mode{text-align:center;color:var(--bl2);font-size:12.5px;font-weight:600;margin:-6px 0 8px}

@media(max-width:760px){.app{grid-template-columns:1fr}.main{display:none}.app.open .side{display:none}.app.open .main{display:flex}.back{display:grid}.m{max-width:88%}}

/* ---------- presence, receipts, calls (2.1) ---------- */
:root{--on:#22e06b;--off:#5d6475}
.avw{position:relative;flex:none;display:inline-block;line-height:0}
.pd{position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;border:2px solid #000;transition:background .35s,box-shadow .35s;box-sizing:border-box}
.pd.on{background:var(--on);box-shadow:0 0 9px rgba(34,224,107,.75)}.pd.off{background:var(--off)}
.pd.call{display:grid;place-items:center;width:20px;height:20px;right:-5px;bottom:-5px;background:#05110a;border-color:var(--on);color:var(--on);box-shadow:0 0 9px rgba(34,224,107,.5)}
.pd.call svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.av.sil{background:#10131c!important;border:1px solid #232838;color:#4b5266;display:grid;place-items:center}
.av.sil svg{width:56%;height:56%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.it .p2.ty{color:var(--on);font-weight:700}.it .p2.mc{color:var(--red);font-weight:700}
.tk{font-size:11px;letter-spacing:-2px;margin-left:3px;opacity:.85}.tk.r{color:#7fe3ff;opacity:1}.tk.q svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2;vertical-align:-1px;letter-spacing:0}
.tabs{overflow-x:auto;scrollbar-width:none}.tabs button{white-space:nowrap;flex:none}.tabs .bd{display:inline-grid;margin-left:6px;height:16px;min-width:16px;font-size:11px;background:var(--red);color:#fff;box-shadow:none;vertical-align:1px}
.nb{flex:none;text-align:center;padding:6px 12px;background:#14203f;border-bottom:1px solid var(--bl);color:#a9c4ff;font-weight:700;font-size:13px}.nb.off{background:#2a0d15;border-color:var(--red);color:#ffb3bd}
.incall .card{text-align:center}.incall .card h2{font-size:22px;margin:2px 0 4px}.incall .btn{padding:12px}.incall #yes{background:linear-gradient(135deg,#12a14b,var(--on));border-color:#7cf0a5;color:#03140a;box-shadow:0 0 16px rgba(34,224,107,.5)}

<div class="boot" id="boot" role="status" aria-live="polite">
  <div class="orb">
    <svg class="ring" viewBox="0 0 300 300" aria-hidden="true" fill="none" stroke-linecap="round">
      <g id="arcs"></g>
    </svg>
    <img class="logo" src="logo.png" alt="WhatsTrix">
  </div>
  <div class="bar" id="bar"><i></i></div>
  <div class="tag" id="tag">
    <p>Good things start with giving.</p>
    <p>I’ve done my part — now it’s time to support the author.</p>
    <p>All <a id="credit" href="#" target="_blank" rel="noopener">credit</a> goes to Solitude and perseverance</p>
  </div>
  <div class="lockbox" id="lockbox">
    <label for="pw">Enter access code</label>
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="••••" aria-label="Access code">
    <div id="pwe" aria-live="assertive"></div>
  </div>
</div>

<div class="nb" id="nb" hidden></div>
<div class="app" id="app">
<aside class="side">
  <div class="me">
    <div class="brand"><img src="icon-192.png" alt=""><span class="wm"><b class="w1">Whats</b><b class="w2">Trix</b></span><button class="ib" id="bSet" title="Sound, notifications, install" data-i="bell"></button></div>
    <div class="top"><div id="mav" style="cursor:pointer" title="Change profile photo"></div><div style="min-width:0"><div class="nm" id="nm" title="Tap to rename"></div><div class="st" id="st"><i></i><span>Starting…</span></div></div></div>
    <div class="rid" id="num"><b id="numv"></b><span>tap to copy</span></div>
    <div class="row"><button class="btn p" id="bQR" data-i="qr" data-l="QR"></button><button class="btn" id="bScan" data-i="scan" data-l="Scan"></button><button class="btn" id="bGrp" data-i="users" data-l="Group"></button><button class="btn" id="rid" data-i="link" data-l="Link" title="Copy my invite link"></button></div>
  </div>
  <div class="join"><input id="jid" placeholder="Enter a number or paste an invite link" inputmode="text" autocomplete="off"><button class="btn p" id="bJoin">Join</button></div>
  <div class="srch"><input id="fs" placeholder="Search chats" autocomplete="off" aria-label="Search chats"></div>
  <div class="tabs" id="tabs"><button class="on" data-f="all">All</button><button data-f="direct">Direct</button><button data-f="groups">Groups</button><button data-f="unread">Unread</button><button data-f="calls">Calls<b class="bd" id="cbd" hidden></b></button></div>
  <div class="list" id="list"></div>
</aside>
<main class="main">
  <div class="welcome" id="splash"><div><img src="logo.png" alt=""><h1>WhatsTrix</h1><p>Encrypted rooms for chat, calls and files.</p><p>No server, no sign-up. Your number is your key.</p></div></div>
  <section class="chat" id="chat" hidden>
    <div class="hd"><button class="ib back" id="bBack" data-i="back"></button><div id="cav" class="dot"></div>
      <div class="t" id="ct"><div class="n" id="cn"></div><div class="s" id="cs"></div></div>
      <button class="ib" id="bSrch" title="Search in chat" data-i="search"></button><button class="ib" id="bInv" title="Room info and invite" data-i="info"></button><button class="ib" id="bVid" title="Video call" data-i="video"></button><button class="ib" id="bVoi" title="Voice call" data-i="phone"></button></div>
    <div class="sb" id="sb" hidden><input id="sq" placeholder="Search in this chat" autocomplete="off"><span id="sc"></span><button class="ib" id="sx" data-i="x" title="Close search"></button></div>
    <div class="stream" id="stream"></div>
    <div class="rpb" id="rpb" hidden><div class="rpt"><b id="rpl"></b><span id="rps"></span></div><button class="ib" id="rpx" data-i="x" title="Cancel"></button></div>
    <div class="foot"><div class="emo" id="emo" hidden></div>
      <button class="ib" id="bEmo" data-i="smile"></button><button class="ib" id="bAtt" title="Share photo, video or file" data-i="clip"></button><input type="file" id="file" hidden>
      <input type="text" id="msg" placeholder="Type a message" autocomplete="off"><button class="ib" id="bMic" title="Voice note" data-i="mic"></button><button class="send" id="bSend" data-i="send" aria-label="Send"></button></div>
  </section>
</main></div>
<div id="ovs"></div><div class="toast" id="toast"></div>

  const o=overlay(`<div style="display:flex;justify-content:center;margin-bottom:8px">${userAv(i,92)}</div><h2>${esc(cn(i))}</h2><p style="font-size:15px;color:var(--tx)">Incoming ${k} call${isG(rooms[g])?' · '+esc(title(rooms[g])):''}</p><div class="row"><button class="btn d" id="no">Decline</button><button class="btn p" id="yes">Answer</button></div>`,'incall');
  let settled=0;const end=why=>{if(settled)return;settled=1;clearTimeout(tm_);stopRing();o.close();
    if(why==='declined'){pend.splice(0).forEach(x=>{send1(x.peer.slice(2),{t:'cr',g,r:'declined'});x.close()});if(callIn){logCall({cid,g,dir:'in',k,st:'declined'});callIn=null}}
    else if(why==='missed'){pend.splice(0).forEach(x=>x.close());if(callIn){logCall({cid,g,dir:'in',k,st:'missed'});callIn=null}}};
  const tm_=setTimeout(()=>end('missed'),45000);
  callIn.end=end;
  o.onclick=null;o.cancel=()=>end('declined');startRing('in');
  if(document.hidden)notify(cn(i),'Incoming '+k+' call','call-'+i,{g});
  c.on('close',()=>{pend=pend.filter(x=>x!==c);if(!pend.length&&!settled&&!(callIn&&callIn.ans))end('missed')});
  o.querySelector('#no').onclick=()=>end('declined');
  o.querySelector('#yes').onclick=async()=>{if(settled)return;settled=1;clearTimeout(tm_);stopRing();o.close();if(callIn)callIn.ans=Date.now();
    try{lstream=await mkStream(k==='video')}catch{lstream=null;pend.splice(0).forEach(x=>x.close());if(callIn){logCall({cid,g,dir:'in',k,st:'failed'});callIn=null}return toast('Could not access microphone/camera.')}
    callG=g;open(g);callUI(g);pend.splice(0).forEach(x=>{x.answer(lstream);hook(x.peer.slice(2),x)});hbAll();
    others(rooms[g]).forEach(x=>{if(!calls[x]&&online.has(x)&&me.id<x&&Object.keys(calls).length<CALLMAX)dial(x,k)})};
  if(pendAnswer&&pendAnswer.g===g&&Date.now()<pendAnswer.until){pendAnswer=null;setTimeout(()=>o.isConnected&&o.querySelector('#yes').click(),500)}}
function endCall(){wrapUp();stopRing();Object.values(calls).forEach(c=>{try{c.close()}catch{}});calls={};pend=[];[aT,camT,blankT,shareT].forEach(t=>t&&t.stop());aT=camT=blankT=shareT=null;clearInterval(blankTimer);lstream=null;callG=null;const d=$('#callui');d&&d.remove();hbAll()}

/* ---------- background push (Web Push, needs the push server) ---------- */
const PUSHURL=()=>String(LS('pushurl')||PUSH_URL||'').replace(/\/+$/,'');
const pushSupported=()=>!NATIVE&&!DESKTOP&&'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const b64u=b=>b64(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const ub64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return ub64(s)};
const allowList=()=>[...new Set(Object.values(rooms).flatMap(r=>r.saved?[]:others(r)))].sort();
async function signedPost(path,body){
  const u=PUSHURL(),p=JSON.stringify({path,id:me.id,ts:Date.now(),nonce:rid()+rid(),...body});
  const sig=b64(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},me.k.sg.privateKey,E.encode(p)));
  const r=await fetch(u+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({p,sig,sp:me.sp,ep:me.ep})});
  if(!r.ok)throw new Error(path+' '+r.status);return r.json().catch(()=>({}))}
async function pushReg(){
  if(!PUSHURL()||!pushSupported()||!me.k)return;
  const reg=await navigator.serviceWorker.ready,k=await (await fetch(PUSHURL()+'/vapid')).json();
  let sub=await reg.pushManager.getSubscription();
  if(sub){const cur=sub.options&&sub.options.applicationServerKey;if(!cur||b64u(cur)!==k.key){await sub.unsubscribe();sub=null}}
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:ub64u(k.key)});
  plast=allowList().join(',');
  await signedPost('/register',{sub:sub.toJSON(),allow:allowList(),name:me.name});log('push registered')}
async function pushEnable(){
  if(!PUSHURL())throw new Error('No push server is set up yet.');
  if(Notification.permission!=='granted'&&await Notification.requestPermission()!=='granted')throw new Error('Notifications are blocked in the browser settings.');
  await pushReg();LS('push',true)}
async function pushDisable(){LS('push',false);try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();if(sub){const ep=sub.endpoint;await sub.unsubscribe();if(PUSHURL())await signedPost('/unregister',{endpoint:ep}).catch(()=>{})}}catch(e){log('push off: '+e.message)}}
function pushSched(){if(!me.id||!me.k||LS('push')!==true)return;if(allowList().join(',')===plast)return;clearTimeout(pst_);pst_=setTimeout(()=>pushReg().catch(e=>log('push reg: '+e.message)),3000)}
function pushBoot(){if(LS('push')===true&&pushSupported()&&PUSHURL()&&Notification.permission==='granted')pushReg().catch(e=>log('push reg: '+e.message))}
async function pushNudge(i,kind,x){x=x||{};
  if(!PUSHURL()||LS('pnudge')===false||!me.k)return;
  const key=i+kind+(x.cid||x.g||''),now=Date.now();if(nudged[key]&&now-nudged[key]<(kind==='msg'?30000:8000))return;nudged[key]=now;
  try{await signedPost('/notify',{to:i,kind,name:me.name,g:x.g,cid:x.cid,v:x.v})}catch(e){log('push nudge: '+e.message)}}

/* ---------- access code gate (on the splash) ---------- */
const pwFor=t=>{const d=new Date(t),p=x=>String(x).padStart(2,'0');return p(d.getHours())+p(d.getMinutes())};   // HHMM, 24 h, device clock
const pwOk=v=>{v=String(v).replace(/\D/g,'');return ACCESS_FIXED?v===ACCESS_FIXED:[0,-6e4,6e4].some(o=>v===pwFor(Date.now()+o))};   // one minute either side is accepted
const okGet=()=>{try{return sessionStorage.getItem('rr_ok')==='1'}catch{return false}},okSet=()=>{try{sessionStorage.setItem('rr_ok','1')}catch{}};
function gate(){return new Promise(res=>{
  if(okGet())return res();
  const b=$('#boot'),i=$('#pw'),e=$('#pwe'),box=$('#lockbox');b.classList.add('locked');
  let busy=0,bad=0;
  const check=()=>{if(busy)return;const v=i.value.replace(/\D/g,'');if(v.length<4)return;
    if(pwOk(v)){busy=1;okSet();b.classList.remove('locked');res();return}
    bad++;e.textContent=bad>=5?'Too many tries. Wait a moment…':'Wrong code';box.classList.remove('bad');void box.offsetWidth;box.classList.add('bad');i.value='';
    if(bad>=5){busy=1;i.disabled=true;setTimeout(()=>{busy=0;bad=0;i.disabled=false;e.textContent='';i.focus()},15000)}else i.focus()};
  i.oninput=()=>{e.textContent='';if(i.value.replace(/\D/g,'').length>=4)check()};
  i.onkeydown=ev=>{if(isEnter(ev))check()};
  i.focus();setTimeout(()=>i.focus(),60)})}

function askName(){return new Promise(res=>{
  const o=overlay(`<h2>Choose your name</h2><input id="un" maxlength="24" autocomplete="off" placeholder="Your name"><p>Others see it with a short tag, like <b>Name#${me.id.slice(-4)}</b>. Your WhatsTrix number is <b>${fmtN(me.id)}</b>. Share it like a phone number so people can add you.</p><div class="row"><button class="btn p" id="unb">Continue</button></div>`);
  o.onclick=null;o.cancel=()=>{};const i=o.querySelector('#un'),go=()=>{const n=i.value.trim().replace(/#/g,'').slice(0,24);if(n.length<2)return toast('Pick a name with at least 2 characters.');me.name=n;saveMe();o.close();res()};
  o.querySelector('#unb').onclick=go;i.onkeydown=e=>{if(isEnter(e))go()};i.focus();setTimeout(()=>i.focus(),50)})}
document.addEventListener('keydown',e=>{   // typing anywhere goes to the message box (fixes lost keyboard focus)
  if(e.ctrlKey||e.metaKey||e.altKey||e.key.length!==1)return;

function relURL(){try{const m=/^https:\/\/([^.\/]+)\.github\.io\/([^\/?#]+)/i.exec(PUBLIC_URL||location.href);return m?`https://github.com/${m[1]}/${m[2]}/releases/latest`:''}catch{return''}}

  const row=(t,sub,btn)=>`<div class="mem"><div><b>${t}</b><small>${sub}</small></div>${btn}</div>`,B=(id,t,p)=>`<button class="btn sm${p?' p':''}" id="${id}" style="margin-left:auto">${t}</button>`;
  const tg=(id,k,def)=>B(id,(LS(k)===undefined||LS(k)===null?def:LS(k)!==false)?'On':'Off');
  const pushRow=NATIVE||DESKTOP?row('Background alerts','The '+(NATIVE?'Android':'Windows')+' app alerts you while it is running. For alerts when closed, use the installed web app.',''):

  const o=overlay(`<h2>Sound, alerts &amp; apps</h2>${row('Ringtone','Xylophone melody for every call',B('a1','Play test'))}${row('Sound',on?'On':'Off',B('a2',on?'Turn off':'Turn on'))}${row('Notifications',ns==='granted'?'Allowed (while the app is open or in the background)':ns==='denied'?'Blocked: change it in system settings':ns==='unsupported'?'Not supported here':'Not allowed yet',ns==='denied'||ns==='unsupported'?'':B('a3',ns==='granted'?'Send test':'Allow',1))}${pushRow}${pu&&!NATIVE&&!DESKTOP?row('Alert offline contacts','Sends only your number, theirs and your name to the push server, never message text',tg('a11','pnudge',true)):''}${row('Read receipts','Let people see when you read their messages',tg('a12','rcpt',true))}${row('Typing indicator','Let people see when you are typing',tg('a13','typ',true))}${row('Camera and microphone','Needed for calls and voice notes',B('a4','Allow'))}${NATIVE||DESKTOP?row('Installed app','You are using the '+(NATIVE?'Android':'Windows')+' app · v'+APP_VER,''):row('Install app',dip?'Add to your home screen':'Browser menu, then Install or Add to Home Screen',dip?B('a5','Install',1):'')}${rel&&!NATIVE&&!DESKTOP?row('Android APK and Windows EXE','Download from the latest release',B('a9','Open')):''}${row('Backup','Save your chats as a file',B('a8','Export'))}<div class="row"><button class="btn" id="a6">Connection details</button><button class="btn p" id="a7">Done</button></div>`);
  const $o=x=>o.querySelector(x),again=()=>{o.close();alerts()};

  $o('#a4').onclick=async()=>{try{let s;try{s=await navigator.mediaDevices.getUserMedia({audio:true,video:true})}catch{s=await navigator.mediaDevices.getUserMedia({audio:true})}s.getTracks().forEach(t=>t.stop());toast('Camera and microphone allowed')}catch{toast('Blocked. Allow them in the browser or system settings.')}};
  if($o('#a5'))$o('#a5').onclick=()=>{dip&&dip.prompt();dip=null;o.close()};

document.querySelectorAll('[data-i]').forEach(e=>{e.innerHTML=ico(e.dataset.i)+(e.dataset.l?'<span>'+e.dataset.l+'</span>':'')});
